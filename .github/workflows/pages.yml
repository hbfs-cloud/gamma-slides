name: Publish presentation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'assets/**'
      - 'bin/**'
      - 'build/icon.svg'
      - 'docs/images/**'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'presentations/**'
      - 'README.md'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun ci
      - name: Resolve an available desktop download independently of source version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName,assets | bun -e '
            const release = JSON.parse(await Bun.stdin.text());
            const version = release.tagName.replace(/^v/, "");
            const archive = `Gamma.Presenter-${version}-arm64-mac.zip`;
            if (!/^\d+\.\d+\.\d+$/.test(version) || !release.assets.some(asset => asset.name === archive)) {
              throw new Error("The published desktop release has no matching ZIP asset");
            }
            console.log("GAMMA_PUBLIC_RELEASE_VERSION=" + version);
          ' >> "$GITHUB_ENV"
      - name: Build presentation library
        run: bun bin/gamma-slides.js library -d presentations -i src/schema/examples/corporate-demo.yaml --language en -o _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
