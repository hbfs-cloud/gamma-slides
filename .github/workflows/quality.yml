name: Verify Gamma Presenter

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamma-presenter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-desktop-contracts:
    name: Bun unit and integration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ci
      - run: bun run test

  browser-e2e:
    name: Chromium visual and interaction matrix (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - name: Install recording verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Select the locked test browser for Playwright and isolated tabs
        run: bun -e 'import { chromium } from "@playwright/test"; console.log("GAMMA_BROWSER_EXECUTABLE=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bun run test:browser --grep-invert @capture-performance --shard=${{ matrix.shard }}/3
        env:
          GAMMA_ENDURANCE_SECONDS: '60'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-presenter-browser-evidence-${{ matrix.shard }}
          path: |
            test-results/
            output/
          if-no-files-found: warn
          retention-days: 7

  capture-performance:
    name: macOS 1080p WebRTC performance and lifecycle
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ci
      - run: bunx playwright install chromium
      - name: Select the locked test browser for Playwright and isolated tabs
        run: bun -e 'import { chromium } from "@playwright/test"; console.log("GAMMA_BROWSER_EXECUTABLE=" + chromium.executablePath())' >> "$GITHUB_ENV"
      # Keep the >24 fps acceptance threshold on the product's target OS.
      # These two complete tests complement (not skip) the 108 Linux scenarios.
      - run: bun run test:browser --grep @capture-performance
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-presenter-capture-performance
          path: output/
          if-no-files-found: warn
          retention-days: 7
