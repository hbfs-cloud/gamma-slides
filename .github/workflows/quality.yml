name: Verify Gamma Presenter

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gamma-presenter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-desktop-contracts:
    name: Bun unit and integration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ci
      - run: bun run test

  browser-e2e:
    name: Chromium visual and interaction matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bun run test:browser
        env:
          GAMMA_ENDURANCE_SECONDS: '60'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-presenter-browser-evidence
          path: |
            test-results/
            output/
          if-no-files-found: warn
          retention-days: 7
