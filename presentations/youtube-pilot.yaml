  - layout: bullets
    variant: video-story
    composition: sequence
    title: Trois responsabilités.
    items:
      - title: Écrire le propos
      - title: Vérifier le rendu
      - title: Conduire la prise
    transition: fade
    scene:
      camera:
        visible: false
        position: br
        width: 0.18
    source: Parcours de production proposé.
    narration: >-
      Nous allons séparer le travail en trois responsabilités. D’abord, écrire un propos avec un
      début, une preuve et une conclusion. Ensuite, vérifier le rendu produit par le moteur : les
      mots, les unités, les relations et la lisibilité. Enfin, conduire la prise : ouvrir la bonne
      sortie, choisir les sources et enregistrer au bon rythme. Le logiciel relie ces étapes. Il ne
      décide pas à votre place de ce que votre public doit retenir.
    notes: >-
      Réalisation : caméra masquée ; conserver le microphone actif. Lire la narration, marquer une
      respiration avant de changer de scène.

