    narration: >-
      Ce deuxième gros plan relie le moteur au fichier HTML qu’il produit. Le navigateur affiche
      ensuite ce document et Reveal orchestre les slides. Les composants peuvent activer des
      graphiques, des diagrammes ou des médias. Il existe donc plusieurs comportements dans le même
      deck. Une slide statique et une démonstration interactive ne demandent pas la même
      préparation. Avant de filmer, il faut tester les interactions que l’on compte vraiment
      montrer, dans l’ordre du récit.
