    transition: fade
    scene: { camera: { visible: true, position: br, width: 0.18 } }
    source: src/schema/deck.schema.json · docs/presenter-studio.md
    narration: >-
      The generator can produce a document that conforms to a schema. The viewer is looking for an
      answer to a question. They cannot click through a video to read a tooltip, change a view, or
      enlarge a legend. Choose what needs to be understood at each moment.
    notes: >-
      Direction: camera bottom-right, 18% width. Keep the lower-right area clear. Read the
