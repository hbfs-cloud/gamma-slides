    transition: fade
    scene: { camera: { visible: true, position: br, width: 0.18 } }
    source: src/loader/assets.js · docs/presenter-studio.md
    narration: >-
      A document can embed fonts, libraries, and supported local media. A remote URL still depends
      on the network, and a site can refuse an iframe. Local browser mode and the terminal need
      relevant server options. A standalone HTML file does not turn every external service offline.
    notes: >-
