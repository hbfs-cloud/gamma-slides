    source: src/schema/deck.schema.json · docs/presenter-studio.md
    narration: >-
      Le problème commence lorsque l’on confond deux résultats. Le générateur sait produire un
      document qui respecte un schéma. Le spectateur, lui, cherche une réponse à une question. Il ne
      peut pas cliquer dans votre vidéo pour lire une infobulle, changer de vue ou agrandir une
      légende. La qualité de la présentation interactive ne garantit donc pas celle du film. Il faut
      choisir ce qui doit être compris à chaque instant.
    notes: >-
      Réalisation : caméra en bas à droite, largeur 18 %. Garder la zone droite inférieure libre.
      Lire la narration, marquer une respiration avant de changer de scène.

