    title: Pause is part of the rhythm.
    subtitle: Prepare. Resume. Explain.
    transition: fade
    scene: { camera: { visible: true, position: br, width: 0.18 } }
    source: docs/presenter-studio.md · take bar
    narration: >-
      A take does not need to be an unbroken performance. The recording bar offers a real
      MediaRecorder pause: prepare the next passage, resume, and continue. Microphone and camera
      are controlled separately. A face appears when the scene needs it, not by permanent
      obligation.
    notes: >-
      Direction: camera bottom-right, 18% width. Keep the lower-right area clear. Read the
      narration and leave a breath before changing scenes.

