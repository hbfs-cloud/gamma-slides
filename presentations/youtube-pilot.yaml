    narration: >-
      Le chargeur lit le YAML ou le JSON, puis appelle la validation du deck. Une structure invalide
      déclenche une erreur au lieu d’être envoyée silencieusement au rendu. Pour un diagramme
      Archify, le chargeur fait également compiler la spécification typée. C’est un garde-fou utile
      : il attrape les contrats de données incorrects. Mais il ne sait pas si votre explication est
      pertinente. Un titre vague ou une conclusion erronée peut être parfaitement valide.
