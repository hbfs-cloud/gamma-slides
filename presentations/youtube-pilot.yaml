      - title: Verify the output
      - title: Run the take
    transition: fade
    scene: { camera: { visible: false, position: br, width: 0.18 } }
    source: Proposed production workflow.
    narration: >-
      First, write an argument with a beginning, evidence, and conclusion. Next, verify the words,
      units, relationships, and legibility the engine renders. Finally, open the right output,
      choose the sources, and record at the right pace. Software connects these steps; it does not
      decide what your audience should remember.
    notes: >-
      Direction: camera hidden; keep the microphone active. Read the narration and leave a breath
      before changing scenes.

