    narration: >-
      A horizontal video reduced to a 390-pixel player does not become a responsive page.
      Everything shrinks: text, labels, and details. Keep the main message large, use close-ups for
      mechanisms, and put detailed references in notes. If an essential detail is illegible, move
      closer or spread the explanation across several scenes.
