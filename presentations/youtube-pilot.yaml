    source: src/loader/assets.js · docs/presenter-studio.md
    narration: >-
      Le document peut embarquer ses polices, ses bibliothèques et des médias locaux pris en charge.
      C’est pratique pour transporter un deck. Mais un asset référencé par une URL distante reste
      dépendant du réseau. Un site peut aussi refuser d’être affiché dans une iframe. Le mode
      navigateur local et le terminal nécessitent les options de serveur correspondantes. Avant une
      démonstration, vérifiez donc les ressources effectivement utilisées. Un fichier HTML autonome
      ne transforme pas tous les services externes en contenu hors ligne.
    notes: >-
