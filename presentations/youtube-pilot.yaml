    source: Proposed editorial method.
    narration: >-
      Reduce your first take to one precise question. Prepare the few scenes that answer it, show a
      real mechanism with an honest example, and state a conclusion the viewer can verify. Generate
      the deck, inspect the small player, rehearse source changes, and make a short take.
    notes: >-
      Direction: camera hidden; keep the microphone active. Read the narration and leave a breath
