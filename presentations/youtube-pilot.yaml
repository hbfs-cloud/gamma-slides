      - title: Browser
    transition: fade
    scene: { camera: { visible: true, position: br, width: 0.18 } }
    source: docs/presenter-studio.md · explicit broadcast
    narration: >-
      You can prepare several tools, but the broadcast choice remains explicit. Select slides, the
      terminal, or the browser. Opening either tool is not enough to send it to public output.
      Announce a change, show one action, then return to the slides with what it proves. Rehearse
      this handoff before recording.
    notes: >-
      Direction: camera bottom-right, 18% width. Keep the lower-right area clear. Read the
      narration and leave a breath before changing scenes.

      Evidence: docs/presenter-studio.md · explicit broadcast
  - layout: title
