      et le navigateur sont exclusifs : ouvrir l’un de ces outils ne suffit pas à l’envoyer à la
      sortie publique. Pour garder un récit clair, annoncez le changement, montrez une seule action,
      puis revenez aux slides avec ce que cette action prouve. Répétez ce passage avant
      l’enregistrement.
