    source: Extrait minimal · src/schema/deck.schema.json
    narration: >-
      Le point de départ est un fichier YAML ou JSON. Ici, deux champs suffisent à montrer le
      principe : le layout choisit une composition, et le titre porte le message. Cet extrait
      appartient à une liste de slides dans un document complet. On peut aussi y déclarer des
      graphiques, des médias, des diagrammes et une narration. Un LLM peut aider à rédiger ce
      fichier. Cela ne dispense pas de relire ses affirmations et de vérifier les assets qu’il
      référence.
    notes: >-
      Réalisation : caméra masquée ; conserver le microphone actif. Lire la narration, marquer une
      respiration avant de changer de scène.

