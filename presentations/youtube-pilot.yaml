    narration: >-
      Une présentation générée peut être correcte, impressionnante, et pourtant difficile à suivre
      en vidéo. Dans cet épisode, nous allons partir de Gamma Slides pour comprendre comment passer
      d’un fichier de contenu à une démonstration enregistrable. Nous suivrons trois choses : ce que
      le moteur automatise, ce que le créateur doit vérifier, et ce que le public voit réellement. À
      la fin, vous aurez un parcours concret pour préparer votre première prise.
    notes: >-
      Réalisation : caméra en bas à droite, largeur 18 %. Garder la zone droite inférieure libre.
      Lire la narration, marquer une respiration avant de changer de scène.

