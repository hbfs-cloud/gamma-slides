    transition: fade
    scene: { camera: { visible: false, position: br, width: 0.18 } }
    source: Hardware validation limits · docs/presenter-studio.md
    narration: >-
      Software checks do not replace a test with your equipment. A synthetic camera can prove that
      composition appears, not that your face is well lit. Test audio can prove a track exists, not
      that your voice is clear. Make a short take with your own camera and microphone, then listen.
    notes: >-
      Direction: camera hidden; keep the microphone active. Read the narration and leave a breath
      before changing scenes.

