    transition: fade
    scene: { camera: { visible: false, position: br, width: 0.18 } }
    source: docs/presenter-studio.md · review and save
    narration: >-
      After stopping, review shows the actual file, dimensions, duration, and size. The browser may
      produce MP4 or WebM, depending on its codecs. Play the take, save it, then open the saved
      file. Until it is saved, do not assume it exists outside page memory.
    notes: >-
