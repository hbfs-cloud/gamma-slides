    source: Méthode éditoriale proposée.
    narration: >-
      Pour votre première prise, réduisez l’ambition à une question précise. Préparez les quelques
      scènes qui permettent d’y répondre. Montrez un mécanisme réel, avec un exemple honnête, puis
      formulez une conclusion que le spectateur peut vérifier. Générez le deck, contrôlez le petit
      lecteur, répétez les changements de source et faites une prise courte. Cette boucle simple
      vous apprendra davantage sur votre production qu’une présentation qui tente de montrer toutes
      les capacités du moteur à la fois.
