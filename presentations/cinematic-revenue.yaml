version: '1'
meta:
  title: Presque deux fois plus · Gamma Slides
  subtitle: Revue de croissance · Données immersives
  author: Gamma Slides
  company: Gamma Slides
  date: '2026-09-08'
  language: fr
  tags: [demo, immersive, revenue, gpu]
  description: Démonstration complète d'une présentation financière immersive.
branding:
  watermark: DONNÉES ILLUSTRATIVES
theme: signal-room
slides:
  - layout: title
    variant: editorial
    tone: dark
    transition: fade
    kicker: DONNÉES ILLUSTRATIVES · REVUE DE CROISSANCE
    label: '01'
    badge: FY24 → FY25
    title: Presque deux fois plus.
    subtitle: Une année de croissance. Cinq segments. Une nouvelle échelle.
    metrics:
      - {label: Revenu FY25, value: '$16.2M'}
      - {label: Variation, value: '+95.2%'}
      - {label: Premier contributeur, value: Platforms}
    source: Données illustratives · Revenus par segment
    footnote: Les volumes sont proportionnels aux valeurs fournies.
    narration: Le revenu passe de 8,3 à 16,2 millions de dollars. La suite montre d'où vient cette accélération.

  - layout: chart
    variant: cinematic
    transition: fade
    title: Le revenu change d'échelle.
    subtitle: FY24 et FY25, réunis dans deux volumes comparables.
    chart: &revenue
      type: bar
      data:
        labels: [Enterprise, Platforms, Fintech, Marketplaces, Other]
        datasets:
          - label: FY24
            values: [3100000, 1400000, 2200000, 1000000, 600000]
            color: '#9DA5B2'
          - label: FY25
            values: [5200000, 4000000, 3500000, 2100000, 1400000]
            color: primary
      options:
        format_y: currency_m
        show_legend: true
        show_values: true
        x_label: Segment client
        y_label: Revenu
    source: Données illustratives · Revenus par segment
    footnote: FY24 → FY25 · USD · Chaque volume est proportionnel au revenu.
    narration: Les deux volumes rendent le quasi-doublement immédiatement visible. Les chiffres exacts restent accessibles dans Les chiffres.

  - layout: chart
    variant: cinematic
    transition: fade
    title: Platforms a ouvert la brèche.
    subtitle: Le même mouvement, ouvert segment par segment.
    chart: *revenue
    source: Données illustratives · Variation de revenu par segment
    footnote: Platforms ajoute 2,6 millions, soit 32,9 % de la variation nette.
    narration: En ouvrant les volumes, Platforms apparaît comme la première contribution à la hausse, avec 2,6 millions de dollars.

  - layout: chart
    variant: cinematic
    transition: fade
    title: La croissance a gardé sa qualité.
    subtitle: Le profit brut progresse avec le revenu, segment par segment.
    chart:
      type: bar
      data:
        labels: [Enterprise, Platforms, Fintech, Marketplaces, Other]
        datasets:
          - label: FY24
            values: [2100000, 840000, 1540000, 650000, 420000]
            color: '#9DA5B2'
          - label: FY25
            values: [3640000, 2400000, 2450000, 1260000, 910000]
            color: primary
      options:
        format_y: currency_m
        show_legend: true
        show_values: true
        x_label: Segment client
        y_label: Profit brut
    source: Données illustratives · Profit brut par segment
    footnote: Le profit brut passe de 5,55 à 10,66 millions de dollars.
    narration: Le profit brut progresse lui aussi, de 5,55 à 10,66 millions. La croissance n'est pas seulement volumique.

  - layout: closing
    variant: decisions
    transition: fade
    title: La question n'est plus si nous pouvons croître.
    subtitle: C'est comment nous transformons cette nouvelle échelle en avantage durable.
    items:
      - title: Protéger Platforms
        description: Accélérer le segment qui apporte la première contribution nette.
      - title: Financer la qualité
        description: Convertir le profit brut additionnel en capacité d'exécution.
      - title: Mesurer la suite
        description: Suivre le mix, la marge et la répétabilité de chaque segment.
    source: Données illustratives · Synthèse de démonstration
    footnote: Exemple autonome pour Gamma Slides.
    narration: La croissance est démontrée. Les trois décisions portent maintenant sur sa qualité, son financement et sa répétabilité.
