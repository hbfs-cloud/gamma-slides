version: '1'
meta:
  title: Nearly double · Gamma Slides
  subtitle: Growth review · immersive data
  author: Gamma Slides
  company: Gamma Slides
  date: '2026-09-08'
  language: en
  tags: [demo, immersive, revenue, gpu]
  description: Complete demonstration of an immersive financial presentation.
branding:
  watermark: ILLUSTRATIVE DATA
theme: signal-room
slides:
  - layout: title
    variant: editorial
    tone: dark
    transition: fade
    kicker: ILLUSTRATIVE DATA · GROWTH REVIEW
    label: '01'
    badge: FY24 → FY25
    title: Nearly double.
    subtitle: One year of growth. Five segments. A new scale.
    metrics:
      - {label: FY25 revenue, value: '$16.2M'}
      - {label: Change, value: '+95.2%'}
      - {label: Lead contributor, value: Platforms}
    source: Illustrative data · revenue by segment
    footnote: Volumes are proportional to the supplied values.
    narration: Revenue rises from 8.3 to 16.2 million dollars. The next scenes show where that acceleration came from.

  - layout: chart
    variant: cinematic
    transition: fade
    title: Revenue changes scale.
    subtitle: FY24 and FY25, placed in two comparable volumes.
    chart: &revenue
      type: bar
      data:
        labels: [Enterprise, Platforms, Fintech, Marketplaces, Other]
        datasets:
          - label: FY24
            values: [3100000, 1400000, 2200000, 1000000, 600000]
            color: '#9DA5B2'
          - label: FY25
            values: [5200000, 4000000, 3500000, 2100000, 1400000]
            color: primary
      options:
        format_y: currency_m
        show_legend: true
        show_values: true
        x_label: Customer segment
        y_label: Revenue
    source: Illustrative data · revenue by segment
    footnote: FY24 → FY25 · USD · Every volume is proportional to revenue.
    narration: The two volumes make the near-doubling immediate. Exact figures remain available in Values.

  - layout: chart
    variant: cinematic
    transition: fade
    title: Platforms broke open the gap.
    subtitle: The same move, revealed one segment at a time.
    chart: *revenue
    source: Illustrative data · revenue change by segment
    footnote: Platforms adds 2.6 million dollars, or 32.9% of net change.
    narration: Once the volumes open, Platforms is the largest contribution to growth, at 2.6 million dollars.

  - layout: chart
    variant: cinematic
    transition: fade
    title: Growth kept its quality.
    subtitle: Gross profit rises with revenue, segment by segment.
    chart:
      type: bar
      data:
        labels: [Enterprise, Platforms, Fintech, Marketplaces, Other]
        datasets:
          - label: FY24
            values: [2100000, 840000, 1540000, 650000, 420000]
            color: '#9DA5B2'
          - label: FY25
            values: [3640000, 2400000, 2450000, 1260000, 910000]
            color: primary
      options:
        format_y: currency_m
        show_legend: true
        show_values: true
        x_label: Customer segment
        y_label: Gross profit
    source: Illustrative data · gross profit by segment
    footnote: Gross profit rises from 5.55 to 10.66 million dollars.
    narration: Gross profit also rises, from 5.55 to 10.66 million dollars. Growth is not only about volume.

  - layout: closing
    variant: decisions
    transition: fade
    title: The question is no longer whether we can grow.
    subtitle: It is how we turn this new scale into a durable advantage.
    items:
      - title: Protect Platforms
        description: Accelerate the segment contributing the largest net gain.
      - title: Fund quality
        description: Turn incremental gross profit into execution capacity.
      - title: Measure what follows
        description: Track mix, margin, and repeatability by segment.
    source: Illustrative data · demonstration summary
    footnote: A self-contained Gamma Slides example.
    narration: Growth is established. The three decisions now concern its quality, funding, and repeatability.
