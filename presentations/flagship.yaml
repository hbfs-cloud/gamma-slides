version: "1"

meta:
  title: "FY2025 Board Review & FY2026 Operating Plan"
  subtitle: "Performance, economics, liquidity, markets, and decisions"
  author: "Sarah Chen"
  company: "Acme Corp"
  date: "2025-12-15"
  language: "en"
  tags: ["finance", "board", "markets", "strategy", "demo"]
  description: "Illustrative boardroom flagship covering FY25 performance and the FY26 operating plan"

branding:
  watermark: "CONFIDENTIAL · DEMO"
  company_url: "acme.com"

theme: "boardroom"

narration:
  voice: "en-US-AndrewNeural"
  rate: "-5%"

music:
  track: null
  volume: 0.05

video:
  subtitles: true
  thumbnail:
    slide: 0
    text_overlay: "FY25 Board Review"

slides:
  - layout: title
    variant: editorial
    tone: dark
    transition: fade
    background:
      type: solid
      value: "#0B0F17"
    kicker: "CONFIDENTIAL · BOARD MATERIAL"
    label: "25"
    badge: "FY2025 REVIEW"
    title: "FY25 strengthened the model. FY26 is the scale test."
    subtitle: "Performance review · Operating plan · December 2025"
    metrics:
      - label: "Revenue"
        value: "$16.2M"
      - label: "Gross margin"
        value: "72%"
      - label: "Net retention"
        value: "135%"
    source: "DEMO management reporting · FY25 actuals"
    footnote: "All companies, market series, and forward-looking assumptions are illustrative."
    narration: >
      FY25 strengthened the model across growth, margin, and retention.
      The board question for FY26 is how to scale that momentum with discipline.

  - layout: dashboard
    columns: 4
    transition: fade
    kicker: "EXECUTIVE READOUT"
    title: "We enter FY26 with momentum, better economics—and three decisions."
    subtitle: "The outcome is strong; mix, working capital, and execution capacity remain the watchpoints."
    panels:
      - type: metric
        title: "Outcome"
        value: "$16.2M"
        delta: "+8% vs plan"
        subtitle: "Revenue finished above the FY25 operating plan."
        icon: "trending-up"
      - type: metric
        title: "Quality"
        value: "135%"
        delta: "+12pp YoY"
        subtitle: "Expansion and retention strengthened together."
        icon: "users"
      - type: metric
        title: "Watch"
        value: "71%"
        delta: "rails mix"
        subtitle: "Transfer and FX still drive most revenue."
        icon: "alert-triangle"
      - type: metric
        title: "Today"
        value: "3"
        delta: "decisions"
        subtitle: "Ambition, sequencing, and risk guardrails."
        icon: "target"
    source: "DEMO management reporting · Board synthesis"
    footnote: "Plan and operating-risk statements are illustrative."
    narration: >
      The headline is positive, but the board discussion is not a victory lap.
      We need alignment on the FY26 ambition, execution sequence, and risk limits.

  - layout: metrics
    variant: hero
    transition: fade
    kicker: "FY25 SCORECARD"
    title: "Revenue nearly doubled while margin and retention expanded."
    subtitle: "Scale did not come at the expense of economic quality."
    columns: 4
    metrics:
      - label: "Revenue"
        value: "$16.2M"
        delta: "+95% YoY"
        trend: up
        featured: true
        icon: "dollar-sign"
      - label: "Gross margin"
        value: "72%"
        delta: "+4pp YoY"
        trend: up
        icon: "trending-up"
      - label: "Net revenue retention"
        value: "135%"
        delta: "+12pp YoY"
        trend: up
        icon: "users"
      - label: "Customers"
        value: "85"
        delta: "+67 additions"
        trend: up
        icon: "building"
    insight: "All four board-level indicators moved in the same direction: more scale, better margin, deeper expansion."
    source: "DEMO management reporting · FY25 actuals"
    footnote: "Revenue, gross margin, NRR, and customer count retain the original demo assumptions."
    narration: >
      Revenue reached 16.2 million dollars, up 95 percent.
      Gross margin, net retention, and customer count all improved alongside that growth.

  - layout: chart
    variant: story
    transition: fade
    kicker: "PLAN VS ACTUAL"
    title: "FY25 finished ahead of plan across every board-level metric."
    subtitle: "Actual performance indexed to plan; plan equals 100."
    chart:
      type: bullet
      data:
        labels: ["Revenue", "Gross margin", "Ending cash", "New customers"]
        datasets:
          - label: "Actual"
            values: [108, 103, 109, 122]
        targets: [100, 100, 100, 100]
      options:
        format_y: compact
        max: 130
        show_legend: false
    insight: "Adjusted EBITDA was also $0.7M better than plan, ending at a near-breakeven loss of $0.1M."
    source: "DEMO FY25 operating plan and management reporting"
    footnote: "Index values are derived from actual versus plan; EBITDA is excluded because a loss ratio is not decision-useful."
    narration: >
      Revenue, margin, cash, and customer additions all exceeded plan.
      The adjusted EBITDA loss was also 700 thousand dollars better than budget.

  - layout: chart
    variant: story
    transition: fade
    kicker: "MOMENTUM"
    title: "Q4 reached $4.9M, lifting the exit run-rate to $19.6M."
    subtitle: "Sequential growth remained above 13 percent after the Q2 step-up."
    chart:
      type: combo
      data:
        labels: ["Q1", "Q2", "Q3", "Q4"]
        datasets:
          - label: "Actual revenue"
            type: bar
            values: [3200000, 3800000, 4300000, 4900000]
            color: primary
          - label: "Plan revenue"
            type: bar
            values: [3000000, 3500000, 4000000, 4500000]
            color: "#9DA5B2"
          - label: "QoQ growth"
            type: line
            values: [0, 18.7, 13.2, 14.0]
            color: secondary
            y_axis: right
      options:
        format_y: currency_m
        format_y_right: percent
        show_legend: true
        smooth: true
    insight: "Revenue increased 53 percent from Q1 to Q4; the Q4 annualized run-rate is 19.6 million dollars."
    source: "DEMO management reporting · Quarterly actuals and plan"
    footnote: "QoQ growth and exit run-rate are derived; Q1 growth is intentionally left at zero."
    narration: >
      Quarterly revenue accelerated from 3.2 to 4.9 million dollars.
      Q4 exited at a 19.6 million dollar annualized run-rate.

  - layout: dashboard
    columns: 2
    transition: fade
    kicker: "OPERATING SIGNALS"
    title: "Leading indicators strengthened alongside the year-end revenue step-up."
    subtitle: "Retention quality and processed volume moved together across the year."
    panels:
      - type: chart
        title: "Net revenue retention"
        chart:
          type: line
          data:
            labels: ["Q1", "Q2", "Q3", "Q4"]
            datasets:
              - label: "Actual"
                values: [124, 128, 132, 135]
                color: primary
              - label: "Plan"
                values: [122, 124, 126, 128]
                color: "#9DA5B2"
                dashed: true
          options:
            format_y: percent
            y_min: 115
            y_max: 140
            show_legend: true
      - type: chart
        title: "Quarter-end annualized payment volume"
        chart:
          type: area
          data:
            labels: ["Q1", "Q2", "Q3", "Q4"]
            datasets:
              - label: "Annualized volume"
                values: [420000000, 680000000, 1150000000, 1840000000]
                color: secondary
          options:
            format_y: compact
            show_legend: false
    source: "DEMO product analytics · FY25 quarterly operating series"
    footnote: "Quarter-end annualized volume and retention observations are illustrative leading indicators."
    narration: >
      Retention increased every quarter and finished seven points above plan.
      Processed volume accelerated in parallel with the reported revenue step-up.

  - layout: table
    variant: editorial
    transition: fade
    kicker: "PROFIT & LOSS"
    title: "Gross profit doubled; operating leverage brought EBITDA to breakeven."
    subtitle: "Revenue grew materially faster than the operating cost base."
    table:
      headers: ["$M", "FY24", "FY25", "Change"]
      rows:
        - ["Revenue", "8.3", "16.2", "+95%"]
        - ["Cost of revenue", "(2.7)", "(4.5)", "+67%"]
        - ["Gross profit", "5.6", "11.7", "+107%"]
        - ["Gross margin", "68%", "72%", "+4pp"]
        - ["R&D", "(3.4)", "(4.7)", "+38%"]
        - ["Sales & marketing", "(3.0)", "(4.1)", "+37%"]
        - ["G&A", "(2.2)", "(3.0)", "+36%"]
        - ["Adjusted EBITDA", "(3.0)", "(0.1)", "+$2.9M"]
      column_types: ["text", "amount", "amount", "amount"]
      highlight_column: 2
    insight: "Gross profit grew by 107 percent while operating expenses grew by 37 percent."
    source: "DEMO management P&L · Unaudited"
    footnote: "Rounded figures; expense structure is illustrative and reconciles to adjusted EBITDA."
    narration: >
      Gross profit more than doubled to 11.7 million dollars.
      That operating leverage narrowed the adjusted EBITDA loss from 3 million to 100 thousand dollars.

  - layout: dashboard
    columns: 3
    transition: fade
    kicker: "REVENUE QUALITY"
    title: "Rails fund the engine; software expands revenue quality."
    subtitle: "The current strength and the next quality milestone are visible in the same mix."
    panels:
      - type: chart
        title: "FY25 revenue mix"
        span: 2
        chart:
          type: doughnut
          data:
            labels: ["Transfer fees", "FX spread", "SaaS", "Treasury", "Compliance", "Other"]
            datasets:
              - values: [8400000, 3150000, 2400000, 1200000, 940000, 110000]
                colors: ["primary", "secondary", "#76839A", "#9DA5B2", "accent", "#C2BEB4"]
          options:
            format_y: currency_m
            center_label: "FY25 revenue"
            show_legend: true
      - type: metric
        title: "Software-like mix"
        value: "21%"
        delta: "+100% SaaS"
        subtitle: "SaaS plus compliance; rails remain 71 percent of revenue."
        icon: "layers"
    source: "DEMO management reporting · Revenue by product"
    footnote: "$0.11M other item reconciles disclosed streams to the $16.2M total."
    narration: >
      Transfer and FX rails generate 71 percent of revenue today.
      SaaS and compliance already contribute 21 percent and represent the clearest quality unlock.

  - layout: chart
    variant: story
    transition: fade
    kicker: "SEGMENT PERFORMANCE"
    title: "Platform revenue nearly tripled; every segment contributed to growth."
    subtitle: "FY24 and FY25 revenue by primary customer segment."
    chart:
      type: bar
      data:
        labels: ["Enterprise", "Platforms", "Fintech", "Marketplaces", "Other"]
        datasets:
          - label: "FY24"
            values: [3100000, 1400000, 2200000, 1000000, 600000]
            color: "#9DA5B2"
          - label: "FY25"
            values: [5200000, 4000000, 3500000, 2100000, 1400000]
            color: primary
      options:
        format_y: currency_m
        show_legend: true
        show_values: true
    insight: "Platforms added 2.6 million dollars and became the largest incremental growth pool."
    source: "DEMO management reporting · Revenue by customer segment"
    footnote: "Segment totals reconcile to illustrative FY24 revenue of $8.3M and FY25 revenue of $16.2M."
    narration: >
      Every customer segment grew in FY25.
      Platform revenue nearly tripled and supplied the largest incremental growth pool, while enterprise remained the largest absolute segment.

  - layout: chart
    variant: story
    transition: fade
    kicker: "GROWTH BRIDGE"
    title: "New logos supplied 57% of growth; expansion validated retention."
    subtitle: "The bridge reconciles FY24 revenue to the FY25 outcome."
    chart:
      type: waterfall
      data:
        labels: ["FY24", "Expansion", "Churn", "New logos", "Price / FX", "FY25"]
        datasets:
          - label: "Revenue bridge"
            values: [8300000, 3200000, -300000, 4500000, 500000, 16200000]
      options:
        format_y: currency_m
        total_indices: [0, 5]
        show_legend: false
    insight: "The existing-customer bridge implies 135 percent NRR; new logos contributed 4.5 million dollars."
    source: "DEMO revenue bridge calibrated to FY25 revenue and NRR"
    footnote: "($8.3M + $3.2M − $0.3M) / $8.3M = 135% NRR."
    narration: >
      Existing customers expanded by a net 2.9 million dollars, consistent with 135 percent NRR.
      New logos added a further 4.5 million dollars of revenue.

  - layout: table
    variant: editorial
    transition: fade
    kicker: "UNIT ECONOMICS"
    title: "Enterprise payback fell to 16 months as CAC declined."
    subtitle: "The improvement came from acquisition efficiency and margin, not ACV inflation."
    table:
      headers: ["Enterprise metric", "FY24", "FY25", "Change"]
      rows:
        - ["CAC per new logo", "$132K", "$110K", "−17%"]
        - ["Initial annual contract value", "$116K", "$115K", "Stable"]
        - ["Gross margin", "68%", "72%", "+4pp"]
        - ["CAC payback", "20 months", "16 months", "−4 months"]
        - ["Modeled LTV / CAC", "5.1×", "7.0×", "+1.9×"]
      column_types: ["text", "amount", "amount", "amount"]
      highlight_column: 2
    insight: "Lower CAC and four points of gross-margin expansion reduced payback by four months."
    source: "DEMO enterprise unit-economics model"
    footnote: "Payback equals CAC divided by monthly gross profit from the initial contract."
    narration: >
      Enterprise CAC declined 17 percent while gross margin increased.
      As a result, payback improved from 20 to 16 months and modeled LTV to CAC reached seven times.

  - layout: chart
    variant: story
    transition: fade
    kicker: "COHORT EXPANSION"
    title: "Every mature cohort is above 125% revenue retention."
    subtitle: "Revenue index by customer go-live quarter; month zero equals 100."
    chart:
      type: heatmap
      data:
        x_labels: ["M0", "M3", "M6", "M9", "M12", "M15", "M18", "M21"]
        y_labels: ["24 Q1", "24 Q2", "24 Q3", "24 Q4", "25 Q1", "25 Q2", "25 Q3", "25 Q4"]
        values:
          - [100, 108, 117, 124, 131, 138, 142, 146]
          - [100, 111, 119, 128, 136, 141, 145, null]
          - [100, 109, 118, 127, 134, 139, null, null]
          - [100, 112, 121, 129, 136, null, null, null]
          - [100, 114, 123, 132, null, null, null, null]
          - [100, 113, 125, null, null, null, null, null]
          - [100, 116, null, null, null, null, null, null]
          - [100, null, null, null, null, null, null, null]
      options:
        min: 100
        max: 150
        legend_labels: ["150", "100"]
        show_values: true
    insight: "Mature cohorts expand after onboarding; the weighted FY25 outcome is consistent with 135 percent NRR."
    source: "DEMO cohort model calibrated to management NRR"
    footnote: "Cells show indexed cohort revenue, not logo retention."
    narration: >
      Every cohort with at least 12 months of history is above 125 percent revenue retention.
      The pattern supports the view that usage deepens after onboarding.

  - layout: table
    variant: editorial
    transition: fade
    kicker: "CUSTOMER PROOF"
    title: "Top-account expansion is broad; SaaS MRR is not concentrated."
    subtitle: "Platform subscription MRR only; transaction fees are excluded."
    table:
      headers: ["Account", "Segment", "MRR", "YoY growth", "Motion"]
      rows:
        - ["GlobalTech", "Enterprise", "$12.5K", "+45%", "Expanding"]
        - ["PayFlow", "Enterprise", "$8.2K", "+120%", "Expanding"]
        - ["Nordic Finance", "Premium", "$5.8K", "+30%", "Stable"]
        - ["Latam Transfers", "Premium", "$4.1K", "+85%", "Expanding"]
        - ["Asia Connect", "Standard", "$2.4K", "+60%", "Upgrading"]
      column_types: ["text", "tag", "amount", "amount", "tag"]
      highlight_column: 3
    insight: "The top five represent 16.5 percent of SaaS MRR; the largest account represents 6.3 percent."
    source: "DEMO CRM and billing snapshot · December 2025"
    footnote: "Concentration ratios are derived from $2.4M annual SaaS revenue."
    narration: >
      Expansion is broad across the five highlighted accounts, led by PayFlow at 120 percent.
      The largest account is only 6.3 percent of total SaaS MRR.

  - layout: dashboard
    columns: 2
    transition: fade
    kicker: "COMMERCIAL ENGINE"
    title: "One in five qualified accounts converted; efficiency varies by segment."
    subtitle: "The aggregate funnel is healthy; the segment frontier shows where operating discipline matters."
    panels:
      - type: chart
        title: "Enterprise conversion funnel"
        chart:
          type: funnel
          data:
            labels: ["Qualified", "Discovery", "Solution fit", "Security review", "Contracted"]
            datasets:
              - values: [240, 168, 109, 72, 48]
                colors: ["#76839A", "secondary", "primary", "#008A70", "accent"]
          options:
            show_legend: false
      - type: chart
        title: "CAC–payback efficiency frontier"
        chart:
          type: scatter
          data:
            datasets:
              - label: "Customer segments"
                color: primary
                points:
                  - { name: "Platforms", x: 82000, y: 12, highlight: true }
                  - { name: "Fintech", x: 98000, y: 14, highlight: true }
                  - { name: "Marketplaces", x: 112000, y: 16, highlight: true }
                  - { name: "Banks", x: 148000, y: 21, highlight: true }
                  - { name: "Corporates", x: 126000, y: 18, highlight: true }
          options:
            x_label: "CAC per logo"
            y_label: "Payback months"
            format_x: currency_k
            format_y: compact
            x_min: 60000
            x_max: 170000
            y_min: 8
            y_max: 24
            show_legend: false
            show_all_labels: true
    source: "DEMO CRM funnel and segment economics · December 2025"
    footnote: "Conversion counts and segment economics are illustrative and rounded."
    narration: >
      One in five qualified enterprise accounts converted to contracted business.
      Platforms and fintech define the efficiency frontier, while bank opportunities require tighter pricing and implementation gates.

  - layout: chart
    variant: story
    transition: fade
    kicker: "CASH FLOW"
    title: "Near-breakeven operations limited cash use to $2.3M."
    subtitle: "Working capital and product investment—not operating losses—consumed cash."
    chart:
      type: waterfall
      data:
        labels: ["Opening cash", "EBITDA", "Working capital", "Product / capex", "FX / other", "Ending cash"]
        datasets:
          - label: "Cash bridge"
            values: [11800000, -100000, -1200000, -1100000, 100000, 9500000]
      options:
        format_y: currency_m
        total_indices: [0, 5]
        show_legend: false
    insight: "The 2.3 million dollar cash reduction was fully explained by working capital and capitalized product investment."
    source: "DEMO statement of cash flows · FY25"
    footnote: "Rounded management view; ending cash reconciles to the illustrative balance sheet."
    narration: >
      Cash declined from 11.8 to 9.5 million dollars.
      The movement reflects working capital and product investment rather than recurring operating losses.

  - layout: dashboard
    columns: 3
    transition: fade
    kicker: "LIQUIDITY"
    title: "A debt-free $9.5M cash position preserves execution flexibility."
    subtitle: "The year-end balance sheet remains liquid and conservatively funded."
    panels:
      - type: metric
        title: "Cash"
        value: "$9.5M"
        delta: "2.6× current liabilities"
        subtitle: "Unrestricted year-end cash."
        icon: "dollar-sign"
      - type: metric
        title: "Debt"
        value: "$0.0M"
        delta: "debt-free"
        subtitle: "No financial debt at year-end."
        icon: "shield"
      - type: metric
        title: "Current ratio"
        value: "3.3×"
        delta: "+0.4× YoY"
        subtitle: "Current assets divided by current liabilities."
        icon: "activity"
      - type: table
        title: "Condensed balance sheet"
        span: 3
        table:
          headers: ["$M", "Assets", "Liabilities & equity"]
          rows:
            - ["Cash / payables", "9.5", "1.8"]
            - ["Receivables / deferred revenue", "1.7", "1.4"]
            - ["Other current / other liabilities", "1.1", "0.5"]
            - ["PPE and intangibles / equity", "1.9", "10.5"]
            - ["Total", "14.2", "14.2"]
    source: "DEMO year-end balance sheet · Unaudited"
    footnote: "Current assets of $12.3M divided by current liabilities of $3.7M equals 3.3×."
    narration: >
      Acme ended the year with 9.5 million dollars of cash and no debt.
      A 3.3 times current ratio provides room to execute the FY26 plan.

  - layout: dashboard
    columns: 3
    transition: fade
    kicker: "FINANCE OPERATIONS"
    title: "The close is faster; three controls must scale before volume does."
    subtitle: "Automation is high, but exception governance remains the constraint."
    panels:
      - type: chart
        title: "Wallet reconciliation"
        chart:
          type: gauge
          data:
            value: 99.8
            label: "Automated"
          options:
            format_y: percent
            min: 0
            max: 100
      - type: chart
        title: "Fee and FX recognition"
        chart:
          type: gauge
          data:
            value: 97
            label: "Automated"
          options:
            format_y: percent
            min: 0
            max: 100
      - type: chart
        title: "Deferred revenue"
        chart:
          type: gauge
          data:
            value: 100
            label: "Ratable"
          options:
            format_y: percent
            min: 0
            max: 100
      - type: table
        title: "Open control actions"
        span: 3
        table:
          headers: ["Control gap", "Owner", "Due", "Status"]
          rows:
            - ["Manual corridor exceptions", "Controller", "Q1", "In progress"]
            - ["Stablecoin valuation cut-off", "CFO", "Q1", "In review"]
            - ["Principal-versus-agent memo", "Audit", "Q2", "Planned"]
    source: "DEMO finance close dashboard · December 2025"
    footnote: "Automation percentages and remediation dates are illustrative."
    narration: >
      Core close processes are between 97 and 100 percent automated.
      Three control actions must close before transaction volume scales materially.

  - layout: dashboard
    columns: 2
    transition: fade
    kicker: "QUALITY DIAGNOSTICS"
    title: "Control maturity broadened; remaining exceptions cluster in monitoring."
    subtitle: "The operating system improved, but the residual control workload is still concentrated."
    panels:
      - type: chart
        title: "Finance control maturity · 1–5"
        chart:
          type: radar
          data:
            labels: ["Reconciliation", "Revenue", "Treasury", "Tax", "Entity close", "Forecasting"]
            datasets:
              - label: "FY24"
                values: [3.1, 3.4, 2.8, 2.6, 3.0, 2.9]
                color: "#9DA5B2"
              - label: "FY25"
                values: [4.7, 4.5, 4.1, 3.7, 4.3, 4.0]
                color: primary
          options:
            max: 5
            show_legend: true
      - type: chart
        title: "Open exceptions by domain"
        chart:
          type: pie
          data:
            labels: ["Monitoring", "Revenue", "Treasury", "Tax", "Entity close"]
            datasets:
              - values: [44, 27, 15, 9, 5]
                colors: ["primary", "secondary", "#76839A", "accent", "#C2BEB4"]
          options:
            format_y: percent
            show_legend: true
    source: "DEMO finance controls register · December 2025"
    footnote: "Maturity scores and exception classification are illustrative management assessments."
    narration: >
      Finance control maturity improved across every measured domain.
      Forty-four percent of open exceptions sit in transaction monitoring, which makes that domain the next remediation priority.

  - layout: chart
    variant: story
    transition: fade
    kicker: "MARKET PRIORITIES"
    title: "Four corridors define the opportunity; LatAm comes first."
    subtitle: "Serviceable payment volume by management-priority corridor."
    chart:
      type: treemap
      data:
        items:
          - name: "Latin America · $18B"
            value: 18
          - name: "Southeast Asia · $14B"
            value: 14
          - name: "Europe–Africa · $9B"
            value: 9
          - name: "North America · $7B"
            value: 7
      options:
        show_legend: false
    insight: "The 48 billion dollar serviceable pool is concentrated enough to sequence; current payment volume implies 3.9 percent penetration."
    source: "DEMO management market model · FY26 planning"
    footnote: "Serviceable volume is illustrative; $1.85B quarter-end annualized payment volume is a DEMO assumption."
    narration: >
      Four corridor groups represent 48 billion dollars of serviceable payment volume.
      Latin America is both the largest pool and the first execution priority.

  - layout: chart
    variant: story
    transition: fade
    kicker: "MARKET TAPE"
    title: "Public-market appetite for stablecoin infrastructure strengthened into year-end."
    subtitle: "Illustrative infrastructure-basket index; January 2025 open equals 100."
    chart:
      type: candlestick
      data:
        labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
        values:
          - [100, 104, 97, 106]
          - [104, 102, 99, 108]
          - [102, 110, 101, 112]
          - [110, 108, 105, 114]
          - [108, 116, 107, 119]
          - [116, 115, 111, 120]
          - [115, 122, 113, 124]
          - [122, 129, 120, 132]
          - [129, 132, 126, 136]
          - [132, 138, 130, 141]
          - [138, 136, 133, 143]
          - [136, 142, 135, 145]
        volume: [48, 52, 61, 57, 72, 68, 75, 82, 90, 96, 88, 104]
      options:
