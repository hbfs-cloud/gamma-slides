  - layout: bullets
    composition: roadmap
    title: Un pilote en trois portes.
    subtitle: Séquence proposée ; durée et responsables à convenir.
    items:
      - title: 01 · Corpus
        description: Choisir trois dépôts et leurs audiences; exit on sources et questions validées
      - title: 02 · Démonstration
        description: Produire les decks et tester les appareils cibles; exit on zéro contenu manquant et parcours compris
      - title: 03 · Adoption
        description: Mesurer temps, corrections et coût d’exploitation; exit on décision documentée et propriétaire nommé
    source: Plan proposé · aucune durée ou performance promise
  - layout: closing
    variant: decisions
    composition: decisions
    title: Expliquer mieux. Adopter avec des preuves.
    subtitle: 'Décision proposée : lancer un pilote borné de présentations techniques.'
    items:
      - title: Choisir le premier dépôt
        description: Une question de décision, une audience et une révision.
      - title: Nommer le propriétaire
        description: Architecture, sources et validation visuelle ont un responsable.
      - title: Fixer la porte de sortie
        description: Adoption, corrections supplémentaires ou abandon motivé.
