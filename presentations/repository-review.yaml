  - layout: table
    title: Observer le parcours, pas seulement le processus.
    subtitle: Plan d’instrumentation proposé ; aucune télémétrie de production revendiquée.
    table:
      headers:
        - Signal à ajouter
        - Question opérationnelle
        - Critère du pilote
      rows:
        - - Durée de génération
          - Quel coût par deck et par slide ?
          - Distribution mesurée sur corpus fixé
        - - Échecs de validation / rendu
          - Où le parcours échoue-t-il ?
          - Étape, raison et corrélation identifiables
        - - Poids / temps d’ouverture
          - Le HTML est-il utilisable chez le client ?
          - Budget décidé sur desktop et mobile
        - - Export / capture
          - Le média final est-il complet ?
          - Contrôle du nombre de slides et du fichier
