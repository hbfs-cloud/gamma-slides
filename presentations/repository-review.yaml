  - layout: bullets
    variant: pillars
    title: Le LLM prépare. Les preuves décident.
    subtitle: Nouveau parcours livré avec cette intégration.
    items:
      - title: Inspecter
        description: gamma_inspect_repository fixe la révision et collecte un échantillon de sources.
      - title: Composer
        description: create_repository_presentation couvre système, marché, limites et adoption.
      - title: Vérifier
