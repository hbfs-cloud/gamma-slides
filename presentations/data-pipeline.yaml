            - {id: capacity, label: Scale within limits, focus: [prod, capacity, costs], note: 'Bound worker counts and Batch resources by source quotas, warehouse capacity and cost budgets.'}
            - {id: learn, label: Rehearse recovery, focus: [costs, drills, git], note: 'Observe cost and freshness, rehearse restore and replay, then improve the versioned design.'}
        components:
          - {id: git, type: external, label: Versioned source, sublabel: IaC · workflows · dbt, pos: [45, 70], size: [220, 82]}
          - {id: ci, type: security, label: CI + review, sublabel: Test · scan · approve, pos: [440, 70], size: [220, 82]}
          - {id: prod, type: backend, label: Production, sublabel: Separate roles + state, pos: [835, 70], size: [220, 82]}
          - {id: drills, type: external, label: Recovery drills, sublabel: Restore + bounded replay, pos: [45, 340], size: [220, 82]}
          - {id: costs, type: frontend, label: Operating dashboard, sublabel: Cost · freshness · errors, pos: [440, 340], size: [220, 82]}
          - {id: capacity, type: backend, label: Capacity budgets, sublabel: API · workers · warehouse, pos: [835, 340], size: [220, 82]}
        connections:
          - {id: review, from: git, to: ci, label: proposed change}
          - {id: release, from: ci, to: prod, label: gated deployment, variant: security}
          - {id: budget, from: prod, to: capacity, label: bounded scaling, labelAt: [945, 166]}
          - {id: observe, from: capacity, to: costs, label: measure saturation}
          - {id: rehearse, from: costs, to: drills, label: prove recovery}
          - {id: improve, from: drills, to: git, label: improve runbook}
    source: Architecture walkthrough only · no cloud resources or credentials are provisioned by this demo
    narration: >-
      Scale the constrained layer rather than every layer. Test realistic data volume, skew, backfills, credential rotation and failure recovery.
      Define owners, retention and deletion policies before onboarding CRM data. Validate costs, service limits and n8n licensing for the selected deployment.
      Use this editable deck for an architecture discussion, not as proof that a production integration has been deployed or certified.
